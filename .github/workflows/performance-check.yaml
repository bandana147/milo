name: Performance Check

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Custom URL to test (optional)'
        required: false
        type: string

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-check:
    name: Performance Metrics Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Determine Test URL
        id: url
        run: |
          if [[ -n "${{ github.event.inputs.test_url }}" ]]; then
            echo "test_url=${{ github.event.inputs.test_url }}" >> $GITHUB_OUTPUT
            echo "Using custom URL: ${{ github.event.inputs.test_url }}"
          else
            # For PRs to stage, use the preview URL
            BRANCH="${{ github.head_ref }}"
            BRANCH_CLEAN=$(echo "$BRANCH" | sed 's/\//-/g')
            PR_ORG="${{ github.event.pull_request.head.repo.owner.login }}"
            PR_REPO="${{ github.event.pull_request.head.repo.name }}"
            URL="https://${BRANCH_CLEAN}--${PR_REPO}--${PR_ORG}.aem.live"
            echo "test_url=$URL" >> $GITHUB_OUTPUT
            echo "Using PR preview URL: $URL"
          fi

      - name: Wait for deployment
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Waiting for AEM deployment to be ready..."
          URL="${{ steps.url.outputs.test_url }}"
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Deployment ready (HTTP $HTTP_STATUS)"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP $HTTP_STATUS - waiting 10s..."
            sleep 10
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "⚠️ Warning: Deployment may not be ready, proceeding anyway..."
          fi

      - name: Run Performance Check
        id: perf
        env:
          TEST_URL: ${{ steps.url.outputs.test_url }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_ORG: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_REPO: ${{ github.event.pull_request.head.repo.name }}
        run: |
          node .github/performance/measure-performance.js "$TEST_URL"

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: .github/performance/results.json
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = '.github/performance/results.json';
            
            let comment = '## 📊 Performance Check Results\n\n';
            
            if (!fs.existsSync(resultsPath)) {
              comment += '⚠️ Performance results not available.\n';
            } else {
              const data = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
              const { results, thresholds, passed } = data;
              
              comment += `**Test URL:** ${{ steps.url.outputs.test_url }}\n\n`;
              
              if (passed) {
                comment += '### ✅ All metrics within budget!\n\n';
              } else {
                comment += '### ❌ Some metrics exceed budgets\n\n';
              }
              
              comment += '| Page | LCP | CLS | TBT | JS Size | Status |\n';
              comment += '|------|-----|-----|-----|---------|--------|\n';
              
              for (const result of results) {
                const lcpOk = result.lcp <= thresholds.lcp.budget;
                const clsOk = result.cls <= thresholds.cls.budget;
                const tbtOk = result.tbt <= thresholds.tbt.budget;
                const jsOk = result.jsSize <= thresholds.jsSize.budget / 1024;
                
                const lcpCell = `${result.lcp ? Math.round(result.lcp) : 'N/A'}ms ${lcpOk ? '✅' : '❌'}`;
                const clsCell = `${result.cls || 'N/A'} ${clsOk ? '✅' : '❌'}`;
                const tbtCell = `${result.tbt ? Math.round(result.tbt) : 'N/A'}ms ${tbtOk ? '✅' : '❌'}`;
                const jsCell = `${result.jsSize}KB ${jsOk ? '✅' : '❌'}`;
                
                const allOk = lcpOk && clsOk && tbtOk && jsOk;
                const statusCell = allOk ? '✅ Pass' : '❌ Fail';
                
                const pageName = result.name || new URL(result.url).pathname || '/';
                comment += `| ${pageName} | ${lcpCell} | ${clsCell} | ${tbtCell} | ${jsCell} | ${statusCell} |\n`;
              }
              
              comment += '\n<details>\n<summary>📦 Heaviest resources (top 5 per page)</summary>\n\n';
              for (const result of results) {
                const pageName = result.name || new URL(result.url).pathname || '/';
                comment += `**${pageName}**\n`;
                if (result.topResources && result.topResources.length) {
                  for (const res of result.topResources) {
                    const sizeKb = res.size ? (res.size / 1024).toFixed(1) : '0.0';
                    comment += `- ${sizeKb}KB — ${res.name}\n`;
                  }
                } else {
                  comment += '- No resource data collected\n';
                }
                comment += '\n';
              }
              comment += '</details>\n';
              
              comment += '\n<details>\n<summary>📋 Budget Thresholds</summary>\n\n';
              comment += '| Metric | Budget | Description |\n';
              comment += '|--------|--------|-------------|\n';
              comment += `| LCP | ${thresholds.lcp.budget}ms | ${thresholds.lcp.description} |\n`;
              comment += `| CLS | ${thresholds.cls.budget} | ${thresholds.cls.description} |\n`;
              comment += `| TBT | ${thresholds.tbt.budget}ms | ${thresholds.tbt.description} |\n`;
              comment += `| JS Size | ${(thresholds.jsSize.budget / 1024).toFixed(0)}KB | ${thresholds.jsSize.description} |\n`;
              comment += '\n</details>\n';
            }
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('📊 Performance Check Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

